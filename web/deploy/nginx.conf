# /etc/nginx/sites-available/voluntariat  →  symlink into sites-enabled/
#
# Run certbot AFTER the plain-HTTP block below is serving, then let it rewrite this file:
#   certbot --nginx -d voluntariat.example.cat
#
# The app binds 127.0.0.1 only (see the systemd unit), so nginx is the only way in.

# Rate-limit the sign-in and sync endpoints. Everything else is behind a session anyway.
limit_req_zone $binary_remote_addr zone=voluntariat_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name voluntariat.example.cat;

    # certbot replaces this with a redirect to 443 and its own TLS block.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voluntariat.example.cat;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The Excel export of a full quarter is the biggest response; uploads are never needed.
    client_max_body_size 1m;
    # A full resync reads every booking ever made and can take minutes.
    proxy_read_timeout 600s;

    access_log /var/log/nginx/voluntariat.access.log;
    error_log  /var/log/nginx/voluntariat.error.log;

    # Auth.js needs the real scheme and host to build its callback URLs; without these the
    # OAuth redirect comes back as http:// and Google rejects it.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    location /api/auth/ {
        limit_req zone=voluntariat_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Cron hits this over the loopback and never through nginx; from outside it is only
    # reachable by a signed-in coordinator, but rate-limit it anyway — it is expensive.
    location /api/sync {
        limit_req zone=voluntariat_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
