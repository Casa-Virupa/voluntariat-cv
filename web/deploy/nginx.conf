# /etc/nginx/sites-available/voluntariat  →  symlink into sites-enabled/
#
# voluntariat.casavirupa.com → Next.js standalone on 127.0.0.1:3003, run by PM2.
#
# Install it with `sudo deploy/setup-server.sh`, which symlinks this file, reloads nginx and
# then runs `certbot --nginx`. This is HTTP-only on purpose: certbot adds the `listen 443`
# block, the certificate lines and the http→https redirect in place, exactly as it did for
# the other sites on this box. Writing a TLS block here by hand cannot work — `listen 443
# ssl` pointing at a certificate that does not exist yet fails `nginx -t`, and on a shared
# box a failed `nginx -t` blocks the reload for every other site too.
#
# After certbot has run, THIS FILE IS NO LONGER THE LIVE CONFIG — the live one is
# /etc/nginx/sites-available/voluntariat with certbot's additions. Re-running
# setup-server.sh will not clobber them; it detects the certificate and leaves the vhost be.
#
# Both address families: each `listen` has a `[::]` twin, so the domain needs a DNS **AAAA**
# record as well as an A record. setup-server.sh checks both and says which is missing.

server {
    listen 80;
    listen [::]:80;
    server_name voluntariat.casavirupa.com;

    access_log /var/log/nginx/voluntariat.access.log;
    error_log  /var/log/nginx/voluntariat.error.log;

    # Auth.js builds its OAuth callback URL from these. Without X-Forwarded-Proto the
    # callback comes back as http:// and Google rejects it with redirect_uri_mismatch.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # A full resync reads every booking ever made and takes minutes. nginx defaults to a
    # 60s read timeout, which would turn that into a 504 halfway through.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Biggest response is the Excel export of a quarter; nothing is ever uploaded.
    client_max_body_size 1m;

    # Content-hashed, so a stale file cannot be served under a new name. `current` is the
    # same symlink PM2 runs from. Falls back to the app if the file is not there.
    location /_next/static/ {
        alias /srv/voluntariat-dashboard/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3003;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
    }
}
